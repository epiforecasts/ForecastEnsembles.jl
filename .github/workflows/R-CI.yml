name: R-CI
# Tests the R wrapper (r-pkg/ForecastEnsembles). Heavier than the Julia CI: it
# stands up the JuliaConnectoR bridge, which precompiles the ForecastEnsembles.jl
# bridge project (HiGHS, JuMP, Optim) on the first run. The Julia depot is
# cached, so subsequent runs are fast. Coupled to the Julia source because
# the R tests exercise it through the bridge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Real runs top out around 22 min cold (bridge precompile) / ~5 min warm, so
    # 30 caps a transient hang without failing any legitimate run.
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}  # for Remotes: sbfnk/juliaready
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          # 1.11 floor: the bridge pulls in ForecastEnsembles, which dropped 1.10.
          version: '1.11'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

      - uses: r-lib/actions/setup-r@v2
        # Guard the RSPM fetch: this step has hung for the full job timeout on
        # transient network trouble, so fail it fast and name the culprit.
        timeout-minutes: 10
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # juliaready comes from DESCRIPTION Remotes (public repo).
          extra-packages: any::testthat, any::devtools
          working-directory: r-pkg/ForecastEnsembles

      - name: Instantiate the Julia bridge
        # Devs the repo-root ForecastEnsembles.jl into the bundled bridge project
        # (unregistered, so it must come from source) and precompiles it.
        # julia_ready() in the R package runs with install = FALSE, so the
        # depot must be warm before the tests call into it. This step also
        # populates the cache saved by julia-actions/cache.
        run: |
          julia --project=r-pkg/ForecastEnsembles/inst/julia -e '
            using Pkg
            Pkg.develop(path = pwd())
            Pkg.instantiate()
            Pkg.precompile()'

      - name: Run testthat
        # devtools::test() runs against the source tree; the test helper sets
        # options(ForecastEnsembles.jl_path = <repo root>), which julia_setup() now
        # reads by default, so the bridge finds the checked-out source.
        working-directory: r-pkg/ForecastEnsembles
        run: |
          Rscript -e 'devtools::test(stop_on_failure = TRUE)'
