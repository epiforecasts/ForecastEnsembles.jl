# Based on EpiAwarePackageTools.scaffold, customised: explicit DOCUMENTER_KEY
# passing (cross-org `secrets: inherit` does not forward secrets to a reusable
# workflow in another organisation).
name: Documenter

on:
  push:
    branches: main
    tags: '*'
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Documenter:
    uses: EpiAware/.github/.github/workflows/documentation.yml@8c1e09003b9cf0d2eb3cbec7aa726855bb365ac5
    secrets:
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
