# Based on EpiAwarePackageTools.scaffold, customised: explicit DOCUMENTER_KEY
# passing (cross-org `secrets: inherit` does not forward secrets to a reusable
# workflow in another organisation).
name: Documenter

on:
  push:
    branches: main
    tags: '*'
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Documenter:
    uses: EpiAware/.github/.github/workflows/documentation.yml@11263ddd07f3d88c54a6245828a81d10a83fcb29
    secrets:
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
