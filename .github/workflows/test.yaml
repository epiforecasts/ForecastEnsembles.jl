# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: EpiAware/.github/.github/workflows/tests.yml@8c1e09003b9cf0d2eb3cbec7aa726855bb365ac5
    # The kit requires Julia >= 1.11, so LTS (1.10) is dropped; test the 1.11
    # floor, the current release, and pre.
    with:
      julia_versions: '["1.11", "1", "pre"]'
    secrets: inherit  # pragma: allowlist secret

  downgrade-compat:
    uses: EpiAware/.github/.github/workflows/downgrade.yml@8c1e09003b9cf0d2eb3cbec7aa726855bb365ac5
    # Run the downgrade suite on the 1.11 floor (the default 1.10 is unsupported).
    with:
      julia_version: '1.11'
    secrets: inherit  # pragma: allowlist secret
