# PACKAGE-OWNED — scaffold writes this once and never overwrites it.
# The benchmark environment, so `julia --project=benchmark benchmark/run.jl`
# resolves. Seeded with BenchmarkTools, the package, and the shared
# EpiAwarePackageTools benchmark harness. EpiAwarePackageTools is pinned by git
# via `[sources]` until it is registered (mirror the test env's pin if you
# switch to a path).
[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
EpiAwarePackageTools = "7aaea248-0d11-4a0d-a7dc-86da30abb951"
ForecastEnsembles = "1bb9cac4-d66e-4ef2-b2ac-777309f9bc63"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"

[sources]
ForecastEnsembles = {path = ".."}

[compat]
EpiAwarePackageTools = "0.3"
BenchmarkTools = "1"
DataFrames = "1"
